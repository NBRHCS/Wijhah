version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
